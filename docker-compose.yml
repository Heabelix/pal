version: "3.9"

# MySQL est géré par mysql/docker-compose.yml
# Démarrer d'abord : cd mysql && docker compose up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: ${DATABASE_DSN}
      PORT: "${BACKEND_PORT}"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - pal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - pal-network

networks:
  pal-network:
    external: true
    name: pal-network
