version: "3.9"

# MySQL est géré par mysql/docker-compose.yml
# Démarrer d'abord : cd mysql && docker compose up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: "pal:pal@tcp(pal-mysql:3306)/paldb?parseTime=true&charset=utf8mb4&loc=UTC"
      PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - pal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pal-network

networks:
  pal-network:
    external: true
    name: pal-network
