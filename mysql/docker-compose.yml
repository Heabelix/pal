version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: pal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paldb
      MYSQL_USER: pal
      MYSQL_PASSWORD: pal
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - pal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pal", "-ppal"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:latest
    container_name: pal-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - pal-network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:

networks:
  pal-network:
    name: pal-network
    driver: bridge
