# Application
quarkus.application.name=pal-backend

# HTTP
quarkus.http.port=8080

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# Datasource MySQL
quarkus.datasource.db-kind=mysql

# Dev : MySQL local (configurer via variables d'env si besoin)
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:mysql://localhost:3306/paldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4}
%dev.quarkus.datasource.username=${DATABASE_USER:root}
%dev.quarkus.datasource.password=${DATABASE_PASSWORD:}

# Prod : MySQL (variables d'env obligatoires)
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:mysql://localhost:3306/paldb?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4}
%prod.quarkus.datasource.username=${DATABASE_USER:pal}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:pal}

# Pool de connexions Agroal
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=30

# Jackson
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false
